; =============================================================================
; AuthKey-ESP32 — PlatformIO configuration
; TOTP generator + FIDO2 security key (BLE + hybrid/caBLE v2)
; =============================================================================

[env:esp32dev]
; Pinned so builds are reproducible (Arduino core 2.0.17 / mbedTLS 2.28).
platform = espressif32@6.10.0
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

; Two 1.875 MB OTA app slots + 128 KB NVS (credentials, TOTP, WiFi, bonds).
board_build.partitions = partitions.csv

; WiFi networks + OTA password from .env (git-ignored; see .env.example).
extra_scripts = pre:scripts/env_secrets.py

lib_deps =
    olikraus/U8g2@2.36.18
    thomasfredericks/Bounce2@2.72.0
    h2zero/NimBLE-Arduino@2.5.1

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I src
    -Wall
    ; NimBLE: we are a peripheral only.
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    ; PC (security key + keyboard), phone (keyboard) and one spare.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
    -D CONFIG_BT_NIMBLE_MAX_BONDS=8
    ; Long CTAP messages are fragmented into many notifications.
    -D CONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

; Test build: adds console commands that let tools/test_device.py approve
; prompts and read TOTP codes without pressing buttons. Never use day-to-day.
[env:test]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D AUTHKEY_TEST_HOOKS

; Over-the-air updates over WiFi. OTA_PASSWORD (and optionally OTA_HOST,
; default authkey-esp32.local) come from .env; flash once over USB first.
;   pio run -e ota -t upload [--upload-port <device-ip>]
[env:ota]
extends = env:esp32dev
upload_protocol = espota
