; =============================================================================
; ESP32 Hardware Authenticator — PlatformIO Configuration
; TOTP Generator + BLE FIDO2 Security Key
; =============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; --- Serial Monitor ---
monitor_speed = 115200

; --- Library Dependencies ---
lib_deps =
    olikraus/U8g2@^2.35.19
    thomasfredericks/Bounce2@^2.72
    h2zero/NimBLE-Arduino@^2.1.2
    links2004/WebSockets@^2.6.1

; --- Build Flags ---
build_flags =
    ; NimBLE memory optimizations — disable unused roles
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=3
    ; Stack size for crypto operations
    -DARDUINO_RUNNING_CORE=1
    ; Compiler optimizations
    -O2
    -Wall

; --- Partition Table (larger NVS for credential storage) ---
; Uses default partitions; for production, create a custom CSV
; with a larger NVS partition (e.g., 64KB+)
board_build.partitions = default.csv

; --- Upload Settings ---
upload_speed = 921600
